<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>管理ページ</title>
<!-- 管理ページ（#72 報告を見る・#126 お問い合わせ・定型文・設定・プロジェクトの切り替え）。ユーザー専用・ゲームからリンクしない・Capacitor のアプリには入れない（CAP_BUILD=1 のビルドでは入口から外す）。
     縦持ち可（ゲームの #rot は無い）。黒ナンバー配色の簡素な作り -->
<style>:root{--ink:#10151c;--panel:#161d27;--line:#ffffff24;--line2:#ffffff3d;--amber:#ffb648;--paper:#e8e4d9;--dim:#e8e4d999;--red:#ff8a5c;--green:#8fd694}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}html,body{background:var(--ink);color:var(--paper);-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif;font-size:15px;line-height:1.55}body{padding:env(safe-area-inset-top) max(14px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}.wrap{max-width:760px;margin:0 auto}.hide{display:none!important}button,input,select{font:inherit;color:inherit}.btn{border:1px solid var(--amber);background:var(--ink);height:40px;color:var(--amber);letter-spacing:.04em;cursor:pointer;white-space:nowrap;border-radius:999px;flex:none;padding:0 16px;font-weight:800}.btn.fill{background:var(--amber);color:#2a1b04}.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.ghost{border-color:var(--line2);color:var(--paper)}.btn.danger{border-color:var(--red);color:var(--red)}.btn:disabled{opacity:.45}header{z-index:5;background:var(--ink);border-bottom:1px solid var(--line);padding:12px 0 8px;position:-webkit-sticky;position:sticky;top:0}header .row{align-items:center;gap:10px;display:flex}header h1{letter-spacing:.06em;font-size:18px;font-weight:800}header h1 small{letter-spacing:.3em;opacity:.55;white-space:nowrap;font-size:10px;font-weight:600;display:block}header h1{white-space:nowrap}header .me{color:var(--dim);text-align:right;text-overflow:ellipsis;white-space:nowrap;max-width:45%;margin-left:auto;font-size:12px;overflow:hidden}@media (max-width:480px){header .me{display:none}header .row .btn{margin-left:auto}}.tabs{flex-wrap:wrap;gap:6px;margin-top:10px;display:flex}.chip{border:1px solid var(--line2);opacity:.85;cursor:pointer;background:0 0;border-radius:999px;height:32px;padding:0 14px;font-size:13px;font-weight:700}.chip.on{background:var(--amber);border-color:var(--amber);color:#2a1b04;opacity:1}.chip b{font-variant-numeric:tabular-nums;margin-left:4px}.sep{background:var(--line);width:1px;margin:4px 2px}#login{flex-direction:column;gap:12px;max-width:360px;margin:12vh auto 0;display:flex}#login h1{letter-spacing:.06em;margin-bottom:4px;font-size:22px;font-weight:800}#login h1 small{letter-spacing:.3em;opacity:.55;font-size:10px;display:block}#login input{border:1px solid var(--line2);background:#ffffff0d;border-radius:10px;outline:none;height:46px;padding:0 12px;font-size:16px}#login input:focus{border-color:var(--amber)}.msg{min-height:20px;font-size:13px;font-weight:700}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}.card{border:1px solid var(--line2);background:var(--panel);border-radius:12px;margin-top:12px;padding:12px 14px}.card .top{flex-wrap:wrap;align-items:baseline;gap:8px;display:flex}.card .when{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}.card .who{color:var(--amber);font-weight:800}.card .kind{border:1px solid var(--line2);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}.card .kind.bug{border-color:var(--red);color:var(--red)}.card .kind.idea{border-color:var(--green);color:var(--green)}.card .id{opacity:.45;font-variant-numeric:tabular-nums;margin-left:auto;font-size:11px}.card .body{white-space:pre-wrap;word-break:break-word;margin-top:8px;font-size:15px}.card .photo{border:1px solid var(--amber);cursor:zoom-in;background:#000;border-radius:8px;margin-top:10px;display:inline-block;overflow:hidden}.card .photo img{max-width:100%;max-height:220px;display:block}.card .photo.err{color:var(--red);border-color:var(--red);cursor:default;padding:8px 10px;font-size:12px}.card .meta{grid-template-columns:auto 1fr;gap:2px 10px;margin-top:10px;font-size:13px;display:grid}.card .meta span{color:var(--dim);white-space:nowrap}.card .meta b{word-break:break-all;font-variant-numeric:tabular-nums;font-weight:600}.card details{margin-top:8px;font-size:12px}.card summary{cursor:pointer;color:var(--amber);font-weight:700}.card pre{white-space:pre-wrap;word-break:break-all;color:var(--dim);background:#0000004d;border-radius:8px;margin-top:6px;padding:8px;font:12px/1.45 ui-monospace,Menlo,monospace}.card .foot{justify-content:flex-end;gap:8px;margin-top:10px;display:flex}.state{text-align:center;color:var(--dim);margin-top:24px;font-size:14px}.state.err{color:var(--red)}.more{justify-content:center;margin-top:16px;display:flex}.roster{border:1px solid var(--line2);background:var(--panel);border-radius:12px;margin-top:12px}.roster .r{border-top:1px solid var(--line);grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:10px 14px;display:grid}.roster .r:first-child{border-top:0}.roster .r b{font-size:16px;font-weight:800}.roster .r small{color:var(--dim);font-variant-numeric:tabular-nums;grid-column:1;font-size:12px}.roster .r .btn{grid-area:1/2/span 2}#viewer{z-index:20;cursor:zoom-out;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#000000eb;justify-content:center;align-items:center;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#viewer img{object-fit:contain;max-width:100%;max-height:100%}:root{--db:var(--amber)}body[data-db=release]{--db:var(--green)}#proj{gap:6px;padding:10px 0 0;display:flex}#proj button{border:1px solid var(--line2);opacity:.7;cursor:pointer;background:0 0;border-radius:10px;flex:1;height:36px;font-size:13px;font-weight:800}#proj button small{opacity:.6;margin-left:6px;font-size:11px;font-weight:600}#proj button.on{opacity:1;border-color:var(--db);color:var(--db);box-shadow:inset 0 -3px 0 var(--db)}header{border-bottom:2px solid var(--db)}.sub{flex-wrap:wrap;gap:6px;margin-top:10px;display:flex}.big{color:var(--dim);margin-top:14px;font-size:15px}.big b{color:var(--amber);font-variant-numeric:tabular-nums;margin:0 2px;font-size:32px}.card .ticket{letter-spacing:.12em;color:var(--amber);font:800 18px/1 ui-monospace,Menlo,monospace}.card .kind.cat-bug{border-color:var(--red);color:var(--red)}.card .kind.cat-billing{color:#ffd166;border-color:#ffd166}.card .kind.cat-transfer{color:#7cc4ff;border-color:#7cc4ff}.card .kind.cat-idea{border-color:var(--green);color:var(--green)}.card .st{background:#ffffff14;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}.card .st-new{background:var(--amber);color:#2a1b04}.card .st-done{opacity:.6}.card .photos{flex-wrap:wrap;gap:8px;margin-top:10px;display:flex}.card .photos .photo{margin-top:0}.card .photos .photo img{width:auto;max-width:none;height:96px;max-height:none}.card .mail{color:var(--dim);margin-top:10px;font-size:13px}.card .mail b{color:var(--paper);word-break:break-all}.card .ctl{color:var(--dim);flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px;display:flex}.card .ctl input[data-f=tags]{flex:1;min-width:140px}.card .ctl input[type=number]{width:56px}.card select,.card input,.card textarea,.panel select,.panel input,.panel textarea{border:1px solid var(--line2);color:var(--paper);background:#ffffff0d;border-radius:8px;outline:none;padding:6px 8px;font-size:15px}.card select:focus,.card input:focus,.card textarea:focus,.panel input:focus,.panel textarea:focus,.panel select:focus{border-color:var(--amber)}.card .cap{letter-spacing:.08em;color:var(--dim);margin-bottom:4px;font-size:11px;font-weight:800}.card .replies,.card .draft{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.card .rep{background:#00000040;border-radius:8px;margin-top:6px;padding:8px 10px;font-size:13px}.card .rep small{color:var(--dim);font-size:11px;display:block}.card .rep b{margin-top:2px;display:block}.card .rb{white-space:pre-wrap;word-break:break-word;margin-top:4px}.card .draft .btn{margin-top:8px}.card details.reply{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px}.card details.reply summary{font-size:14px}.card details.reply>:not(summary){width:100%;margin-top:8px;display:block}.card details.reply>.row{display:flex}.card details.reply .row{color:var(--dim);flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13px;display:flex}.card textarea{resize:vertical;width:100%;font-family:inherit;line-height:1.55}.panel{border:1px solid var(--amber);background:var(--panel);border-radius:12px;flex-direction:column;gap:8px;margin-top:12px;padding:12px 14px;display:flex}.panel h3{letter-spacing:.06em;font-size:14px;font-weight:800}.panel label{color:var(--dim);align-items:center;gap:6px;font-size:13px;display:flex}.panel .row{flex-wrap:wrap;justify-content:flex-end;gap:8px;display:flex}.card.tpl .tt{font-size:15px}.card.tpl .auto{color:var(--green);font-size:11px;font-weight:800}.card.tpl .body{max-height:9.5em;color:var(--dim);font-size:14px;overflow:hidden}.card .kind.cat-all{opacity:.7}#opsTimes{flex-direction:column;gap:6px;display:flex}.trow{align-items:center;gap:6px;display:flex}.trow input{width:130px}.dim{opacity:.45}#opsState{color:var(--dim);flex-direction:column;gap:2px;font-size:13px;display:flex}#opsState b{color:var(--paper)}.err{color:var(--red)}.card.pl .who{color:var(--paper);font-weight:800}.card .otp{border:1px solid var(--amber);background:#ffb6480f;border-radius:8px;margin-top:10px;padding:10px 12px}.card .otp .code{letter-spacing:.2em;color:var(--amber);-webkit-user-select:all;-moz-user-select:all;user-select:all;margin:4px 0;font:800 26px/1.2 ui-monospace,Menlo,monospace}.card .otp .cap{color:var(--dim);font-size:12px}.card .otp.hide{display:none}</style>
  <script type="module" crossorigin src="../assets/admin-DzzJdHAe.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/supabaseProjects-D2PtZLPG.js">
  <link rel="modulepreload" crossorigin href="../assets/dist-DxukqvvO.js">
</head>
<body>
<div class="wrap">
  <nav id="proj"><button data-db="test">テスト版<small>haitatsu</small></button><button data-db="release">ストア版<small>haitatsu-release</small></button></nav>
  <form id="login" class="hide" autocomplete="on">
    <h1>管理ページ<small>HAITATSU ADMIN</small></h1>
    <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" required>
    <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password" required>
    <button class="btn fill" id="loginBtn" type="submit">ログイン</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <div id="app" class="hide">
    <header>
      <div class="row"><h1>管理ページ<small>HAITATSU ADMIN</small></h1><div class="me" id="me"></div><button class="btn sm ghost" id="logout">ログアウト</button></div>
      <div class="tabs" id="tabs">
        <button class="chip" data-view="inquiries">お問い合わせ<b id="inqN"></b></button>
        <button class="chip" data-view="templates">定型文</button>
        <button class="chip" data-view="settings">設定</button>
        <button class="chip" data-view="players">プレイヤー</button>
        <button class="chip" data-view="errors">エラー</button>
        <span class="sep" data-testers></span>
        <button class="chip" data-view="reports" data-testers>報告</button>
        <button class="chip" data-view="roster" data-testers>名簿<b id="rosterN"></b></button>
      </div>
    </header>
    <!-- お問い合わせ（#126） -->
    <div id="paneInq" class="hide">
      <div class="big" id="inqBig"></div>
      <div class="sub" id="inqStatus">
        <button class="chip on" data-status="new">未対応</button>
        <button class="chip" data-status="in_progress">対応中</button>
        <button class="chip" data-status="waiting">返事待ち</button>
        <button class="chip" data-status="done">済み</button>
        <button class="chip" data-status="">全部</button>
      </div>
      <div id="inqList"></div>
      <div class="more hide" id="inqMoreWrap"><button class="btn" id="inqMore">もっと見る</button></div>
    </div>
    <!-- 定型文（#126） -->
    <div id="paneTpl" class="hide">
      <div class="panel" id="tplForm">
        <h3 id="tplHead">定型文を足す</h3>
        <select id="tplCat"><option value="">共通（どの種類にも）</option><option value="bug">不具合</option><option value="billing">購入・課金</option><option value="transfer">引き継ぎ・データ</option><option value="idea">意見・要望</option><option value="other">その他</option></select>
        <input id="tplTitle" maxlength="60" placeholder="名前（管理ページの中だけで使う）">
        <textarea id="tplBody" rows="7" maxlength="4000" placeholder="本文"></textarea>
        <label><input type="checkbox" id="tplAuto">将来のカスタマー部（AI）が自動で返してよい（購入・課金と共通は選べない）</label>
        <div class="row"><button class="btn sm ghost" id="tplNew">入力を空にする</button><button class="btn sm fill" id="tplSave">保存</button></div>
        <div class="msg" id="tplMsg"></div>
      </div>
      <div id="tplList"></div>
    </div>
    <!-- 設定：運営への通知（#126） -->
    <div id="paneOps" class="hide">
      <div class="panel">
        <h3>お問い合わせの通知（運営用 Gmail）</h3>
        <label><input type="radio" name="opsMode" value="digest">まとめて（決まった時刻に 1 通・日本時間）</label>
        <label><input type="radio" name="opsMode" value="each">1 件ずつ（届くたびに 1 通）</label>
        <div id="opsTimesWrap"><div id="opsTimes"></div><div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn sm ghost" id="opsAdd">時刻を足す</button></div></div>
        <div class="row"><button class="btn sm fill" id="opsSave">保存</button></div>
        <div class="msg" id="opsMsg"></div>
        <div id="opsState"></div>
      </div>
      <!-- 設定の表（#129・admin/config.js が中を作る） -->
      <div id="cfgWrap"></div>
    </div>
    <!-- プレイヤー（#130 B5）：探す・控えの状態・1 回だけのパスワード・削除 -->
    <div id="panePl" class="hide">
      <form class="panel" id="plForm" autocomplete="off">
        <h3>プレイヤーを探す</h3>
        <input id="plQ" placeholder="プレイヤー ID（XXXX-XXXX）か名前の一部。空なら新しい控えの順に 50 人">
        <div class="row"><button class="btn sm fill" type="submit">探す</button></div>
      </form>
      <div id="plList"></div>
    </div>
    <!-- エラー（#140）：アプリで起きたエラー（指紋ごと・多い順） -->
    <div id="paneEr" class="hide">
      <form class="panel" id="erForm" autocomplete="off">
        <h3>アプリのエラー</h3>
        <input id="erPid" placeholder="プレイヤー ID（XXXX-XXXX）で絞る。空なら全員">
        <div class="row"><select id="erDays"><option value="1">1 日</option><option value="7">7 日</option><option value="30" selected>30 日</option><option value="90">90 日</option></select><button class="btn sm fill" type="submit">見る</button></div>
      </form>
      <div class="big" id="erSum"></div>
      <div id="erList"></div>
    </div>
    <!-- 報告（#72・テスト版だけ） -->
    <div id="paneFb" class="hide">
      <div class="sub" id="fbKinds">
        <button class="chip on" data-kind="">全部</button>
        <button class="chip" data-kind="bug">バグ報告</button>
        <button class="chip" data-kind="idea">意見・要望</button>
        <button class="chip" data-kind="other">その他</button>
      </div>
      <div id="list"></div>
      <div class="more hide" id="moreWrap"><button class="btn" id="more">もっと見る</button></div>
    </div>
    <div id="roster" class="hide"></div>
  </div>
</div>
<div id="viewer" class="hide"><img id="viewerImg" alt=""></div>
</body>
</html>
