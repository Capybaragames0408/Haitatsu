<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>報告を見る</title>
<!-- 報告を見る管理ページ（#72）。ユーザー専用・ゲームからリンクしない・Capacitor のアプリには入れない（CAP_BUILD=1 のビルドでは入口から外す）。
     縦持ち可（ゲームの #rot は無い）。黒ナンバー配色の簡素な作り -->
<style>:root{--ink:#10151c;--panel:#161d27;--line:#ffffff24;--line2:#ffffff3d;--amber:#ffb648;--paper:#e8e4d9;--dim:#e8e4d999;--red:#ff8a5c;--green:#8fd694}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}html,body{background:var(--ink);color:var(--paper);-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif;font-size:15px;line-height:1.55}body{padding:env(safe-area-inset-top) max(14px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}.wrap{max-width:760px;margin:0 auto}.hide{display:none!important}button,input,select{font:inherit;color:inherit}.btn{border:1px solid var(--amber);background:var(--ink);height:40px;color:var(--amber);letter-spacing:.04em;cursor:pointer;white-space:nowrap;border-radius:999px;flex:none;padding:0 16px;font-weight:800}.btn.fill{background:var(--amber);color:#2a1b04}.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.ghost{border-color:var(--line2);color:var(--paper)}.btn.danger{border-color:var(--red);color:var(--red)}.btn:disabled{opacity:.45}header{z-index:5;background:var(--ink);border-bottom:1px solid var(--line);padding:12px 0 8px;position:-webkit-sticky;position:sticky;top:0}header .row{align-items:center;gap:10px;display:flex}header h1{letter-spacing:.06em;font-size:18px;font-weight:800}header h1 small{letter-spacing:.3em;opacity:.55;white-space:nowrap;font-size:10px;font-weight:600;display:block}header h1{white-space:nowrap}header .me{color:var(--dim);text-align:right;text-overflow:ellipsis;white-space:nowrap;max-width:45%;margin-left:auto;font-size:12px;overflow:hidden}@media (max-width:480px){header .me{display:none}header .row .btn{margin-left:auto}}.tabs{flex-wrap:wrap;gap:6px;margin-top:10px;display:flex}.chip{border:1px solid var(--line2);opacity:.85;cursor:pointer;background:0 0;border-radius:999px;height:32px;padding:0 14px;font-size:13px;font-weight:700}.chip.on{background:var(--amber);border-color:var(--amber);color:#2a1b04;opacity:1}.chip b{font-variant-numeric:tabular-nums;margin-left:4px}.sep{background:var(--line);width:1px;margin:4px 2px}#login{flex-direction:column;gap:12px;max-width:360px;margin:12vh auto 0;display:flex}#login h1{letter-spacing:.06em;margin-bottom:4px;font-size:22px;font-weight:800}#login h1 small{letter-spacing:.3em;opacity:.55;font-size:10px;display:block}#login input{border:1px solid var(--line2);background:#ffffff0d;border-radius:10px;outline:none;height:46px;padding:0 12px;font-size:16px}#login input:focus{border-color:var(--amber)}.msg{min-height:20px;font-size:13px;font-weight:700}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}.card{border:1px solid var(--line2);background:var(--panel);border-radius:12px;margin-top:12px;padding:12px 14px}.card .top{flex-wrap:wrap;align-items:baseline;gap:8px;display:flex}.card .when{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}.card .who{color:var(--amber);font-weight:800}.card .kind{border:1px solid var(--line2);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}.card .kind.bug{border-color:var(--red);color:var(--red)}.card .kind.idea{border-color:var(--green);color:var(--green)}.card .id{opacity:.45;font-variant-numeric:tabular-nums;margin-left:auto;font-size:11px}.card .body{white-space:pre-wrap;word-break:break-word;margin-top:8px;font-size:15px}.card .photo{border:1px solid var(--amber);cursor:zoom-in;background:#000;border-radius:8px;margin-top:10px;display:inline-block;overflow:hidden}.card .photo img{max-width:100%;max-height:220px;display:block}.card .photo.err{color:var(--red);border-color:var(--red);cursor:default;padding:8px 10px;font-size:12px}.card .meta{grid-template-columns:auto 1fr;gap:2px 10px;margin-top:10px;font-size:13px;display:grid}.card .meta span{color:var(--dim);white-space:nowrap}.card .meta b{word-break:break-all;font-variant-numeric:tabular-nums;font-weight:600}.card details{margin-top:8px;font-size:12px}.card summary{cursor:pointer;color:var(--amber);font-weight:700}.card pre{white-space:pre-wrap;word-break:break-all;color:var(--dim);background:#0000004d;border-radius:8px;margin-top:6px;padding:8px;font:12px/1.45 ui-monospace,Menlo,monospace}.card .foot{justify-content:flex-end;gap:8px;margin-top:10px;display:flex}.state{text-align:center;color:var(--dim);margin-top:24px;font-size:14px}.state.err{color:var(--red)}.more{justify-content:center;margin-top:16px;display:flex}.roster{border:1px solid var(--line2);background:var(--panel);border-radius:12px;margin-top:12px}.roster .r{border-top:1px solid var(--line);grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:10px 14px;display:grid}.roster .r:first-child{border-top:0}.roster .r b{font-size:16px;font-weight:800}.roster .r small{color:var(--dim);font-variant-numeric:tabular-nums;grid-column:1;font-size:12px}.roster .r .btn{grid-area:1/2/span 2}#viewer{z-index:20;cursor:zoom-out;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#000000eb;justify-content:center;align-items:center;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#viewer img{object-fit:contain;max-width:100%;max-height:100%}</style>
  <script type="module" crossorigin src="../assets/admin-UQZOfR_5.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="../assets/supabase-CqWqvApC.js">
</head>
<body>
<div class="wrap">
  <form id="login" class="hide" autocomplete="on">
    <h1>報告を見る<small>HAITATSU ADMIN</small></h1>
    <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" required>
    <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password" required>
    <button class="btn fill" id="loginBtn" type="submit">ログイン</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <div id="app" class="hide">
    <header>
      <div class="row"><h1>報告を見る<small>HAITATSU ADMIN</small></h1><div class="me" id="me"></div><button class="btn sm ghost" id="logout">ログアウト</button></div>
      <div class="tabs" id="tabs">
        <button class="chip on" data-view="fb" data-kind="">全部</button>
        <button class="chip" data-view="fb" data-kind="bug">バグ報告</button>
        <button class="chip" data-view="fb" data-kind="idea">意見・要望</button>
        <button class="chip" data-view="fb" data-kind="other">その他</button>
        <span class="sep"></span>
        <button class="chip" data-view="roster">名簿<b id="rosterN"></b></button>
      </div>
    </header>
    <div id="list"></div>
    <div class="more hide" id="moreWrap"><button class="btn" id="more">もっと見る</button></div>
    <div id="roster" class="hide"></div>
  </div>
</div>
<div id="viewer" class="hide"><img id="viewerImg" alt=""></div>
</body>
</html>
